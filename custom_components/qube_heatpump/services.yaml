# Service names and descriptions are translated via strings.json ("services").
reconfigure:
  fields:
    entry_id:
      required: false
      example: "1234567890abcdef1234567890abcdef"
      selector:
        text:
write_register:
  fields:
    address:
      required: true
      example: 173
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    value:
      required: true
      example: 55.0
      selector:
        number:
          mode: box
    entry_id:
      required: false
      selector:
        text:
    label:
      required: false
      selector:
        text:
