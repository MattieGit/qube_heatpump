# Tooling configuration for the Qube heat pump HACS integration.
# This repository is not a Python package; the shipped code lives in
# custom_components/qube_heatpump and is installed by HACS. Only tool
# settings live here (ruff, pytest, mypy).

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["I", "TC", "BLE", "C901", "SIM", "UP", "PYI", "C4", "B", "W", "TRY", "RUF", "T"]
ignore = ["TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant", "tests", "custom_components"]
combine-as-imports = true
forced-separate = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_integration_version: let the info sensor report the real manifest version",
]

[tool.mypy]
python_version = "3.14"
exclude = '(?x)(^\.venv/ | ^\.git/ | ^\.mypy_cache/)'
# Home Assistant recommended strictness
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

# homeassistant and python_qube_heatpump are installed in the venv and ship
# type information, so they are checked normally. Only untyped third parties
# and the pytest-homeassistant-custom-component test helpers are relaxed.
[[tool.mypy.overrides]]
module = ["voluptuous.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.common", "tests.*"]
ignore_missing_imports = true
disallow_untyped_decorators = false
